# Test, build the .deb, the .rpm and the source tarball on every push and PR.
# Pushing a tag like v1.0.0 also publishes a GitHub Release with all of them attached.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The tag must match __version__ in openrouter-credits-tray.py.
name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo python3-cairo gir1.2-gtk-3.0 \
            gir1.2-ayatanaappindicator3-0.1 gir1.2-secret-1 \
            desktop-file-utils lintian

      - name: Check the tag matches __version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' openrouter-credits-tray.py | head -1)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match __version__ ${version}"
            exit 1
          fi

      - name: Unit tests
        run: make test

      - name: Validate desktop entries
        run: desktop-file-validate packaging/*.desktop

      - name: Build .deb and tarball
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          make deb dist

      - name: Lintian
        run: lintian --fail-on error,warning --info --display-level ">=warning" dist/*.deb

      - name: Install the .deb and smoke-test it
        run: |
          sudo apt-get install -y ./dist/*.deb
          openrouter-credits-tray --version
          test -f /etc/xdg/autostart/openrouter-credits-tray.desktop
          test -f /usr/share/applications/openrouter-credits-tray.desktop
          test -f /usr/share/man/man1/openrouter-credits-tray.1.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openrouter-credits-tray
          path: |
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

  rpm:
    runs-on: ubuntu-24.04
    # Fedora's own registry; dnf upgrade keeps the image current between bumps
    container: registry.fedoraproject.org/fedora:44
    steps:
      # git first, so checkout clones a real repository (needed for the commit time)
      - name: Install build and test dependencies
        run: |
          dnf -y upgrade --refresh
          dnf -y install --setopt=install_weak_deps=False \
            git make rpm-build rpmlint desktop-file-utils \
            python3 python3-gobject python3-cairo gtk3 gobject-introspection \
            libayatana-appindicator-gtk3 libsecret

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit tests
        run: make test

      - name: Build .rpm
        run: |
          # the workspace belongs to the runner user, not root
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          make rpm

      - name: rpmlint
        run: rpmlint -r packaging/openrouter-credits-tray.rpmlintrc dist/*.rpm

      - name: Install the .rpm and smoke-test it
        run: |
          # the image sets tsflags=nodocs; install like a desktop would, man page included
          dnf -y install --setopt=tsflags= ./dist/*.noarch.rpm
          openrouter-credits-tray --version
          test -f /etc/xdg/autostart/openrouter-credits-tray.desktop
          test -f /usr/share/applications/openrouter-credits-tray.desktop
          test -f /usr/share/man/man1/openrouter-credits-tray.1.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openrouter-credits-tray-rpm
          path: dist/*.noarch.rpm
          if-no-files-found: error

  release:
    needs: [build, rpm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub Release and upload its files
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: openrouter-credits-tray*
          merge-multiple: true
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
